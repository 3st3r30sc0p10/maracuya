<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maracuya Naming/Hesitation UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <!-- WebGL compositor canvas (4 layers) -->
      <canvas id="gl-canvas"></canvas>
      <!-- 2D overlay for bounding boxes -->
      <canvas id="overlay"></canvas>
      <!-- HUD -->
      <div id="hud">
        <div class="label" id="state-label">state: --</div>
        <div class="label" id="winner-label">winner: --</div>
        <div class="label">T: <span id="t-value">--</span></div>
        <div class="label">M: <span id="m-value">--</span></div>
      </div>
    </div>
    <script src="app.js?v=30"></script>
  </body>
</html>
