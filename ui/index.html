<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maracuya Naming/Hesitation UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="stage">
      <!-- WebGL compositor canvas (4 layers) -->
      <canvas id="gl-canvas"></canvas>
      <!-- 2D overlay for bounding boxes -->
      <canvas id="overlay"></canvas>
      <!-- HUD: category list with filled square indicator -->
      <div id="hud">
        <div class="hud-row" data-category="passion">
          <span class="hud-label">Passion Fruit</span>
          <span class="hud-square" id="hud-square-passion" aria-label="Passion Fruit indicator"></span>
        </div>
        <div class="hud-row" data-category="maracuya">
          <span class="hud-label">Maracuyá</span>
          <span class="hud-square" id="hud-square-maracuya" aria-label="Maracuyá indicator"></span>
        </div>
        <div class="hud-row" data-category="ambiguous">
          <span class="hud-label">Ambiguous</span>
          <span class="hud-square" id="hud-square-ambiguous" aria-label="Ambiguous indicator"></span>
        </div>
      </div>
    </div>
    <script src="app.js?v=37"></script>
  </body>
</html>
